<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<title>A-90B — Quest 3 Passthrough</title>
<style>
html,body{margin:0;height:100%;background:#080808;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
h1{letter-spacing:4px;font-size:40px;margin:0}
p{max-width:520px;opacity:.7;line-height:1.5;margin:0}
button{width:300px;padding:16px;border:1px solid #666;border-radius:8px;background:#151515;color:#fff;font-size:18px;cursor:pointer}
button:hover{background:#262626}
button:disabled{opacity:.4;cursor:default}
#msg{color:#f66;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="ui">
  <h1>A-90B</h1>
  <p>Mixed reality survival. Obey the sign when it appears: <b>HALT</b> = stay completely still (head and hands). <b>PROCEED</b> = move your head or hands. Survive every round.</p>
  <button id="enter" disabled>CHECKING XR…</button>
  <div id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const RAW = "https://raw.githubusercontent.com/AC1DST4R/90/main/";
const IMG = {
  entity: RAW + "images/A-90b.webp",
  halt: RAW + "images/HALT.webp",
  proceed: RAW + "images/PROCEED.webp",
  attack: RAW + "images/ATTACK.webp"
};
const mkAudio = f => { const a = new Audio(RAW + "sound/" + f); a.preload = "auto"; a.crossOrigin = "anonymous"; return a; };
const SND = { warning: mkAudio("warning.mp3"), fail: mkAudio("fail.mp3"), halt: mkAudio("HALT.ogg"), proceed: mkAudio("PROCEED.ogg") };
function play(a){ try{ a.pause(); a.currentTime = 0; const p = a.play(); if(p) p.catch(()=>{}); }catch(e){} }

// ---------- three.js setup (transparent background = passthrough) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType("local-floor");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 50);
scene.add(camera); // lets head-locked overlays render

const ctrls = [0, 1].map(i => { const c = renderer.xr.getController(i); scene.add(c); return c; });
ctrls.forEach(c => c.addEventListener("selectstart", onSelect));
const grips = [0, 1].map(i => { const g = renderer.xr.getControllerGrip(i); scene.add(g); return g; });
const hands = [0, 1].map(i => { const h = renderer.xr.getHand(i); scene.add(h); return h; });

// ---------- helpers ----------
const loader = new THREE.TextureLoader(); loader.setCrossOrigin("anonymous");
function planeFromImage(url, height, onAspect){
  const mat = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  mesh.scale.set(height, height, 1);
  loader.load(url, t => {
    mat.map = t; mat.needsUpdate = true;
    const asp = t.image.width / t.image.height;
    mesh.scale.set(height * asp, height, 1);
    if (onAspect) onAspect(asp);
  });
  return mesh;
}
function textPanel(w, h){
  const cv = document.createElement("canvas"); cv.width = 1024; cv.height = Math.round(1024 * h / w);
  const ctx = cv.getContext("2d"), tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  mesh.draw = (lines, opts = {}) => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (opts.box !== false){
      ctx.fillStyle = "rgba(0,0,0,.78)"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.strokeStyle = opts.color || "#888"; ctx.lineWidth = 6; ctx.strokeRect(8, 8, cv.width - 16, cv.height - 16);
    }
    ctx.fillStyle = opts.color || "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const n = lines.length, step = cv.height / (n + 1);
    lines.forEach((l, i) => {
      ctx.font = `bold ${l.size || 64}px "Courier New", monospace`;
      ctx.fillText(l.text, cv.width / 2, step * (i + 1));
    });
    tex.needsUpdate = true;
  };
  return mesh;
}
function overlay(mesh){ mesh.renderOrder = 999; mesh.material.depthTest = false; return mesh; }

// ---------- overlays ----------
// Vignette (head-locked): darkens/reddens the real world as tension rises
const vc = document.createElement("canvas"); vc.width = vc.height = 512;
(() => { const x = vc.getContext("2d"), g = x.createRadialGradient(256,256,90,256,256,256);
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(255,255,255,1)");
  x.fillStyle = g; x.fillRect(0,0,512,512); })();
const vigMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(vc), color: 0x000000, transparent: true, opacity: 0, depthWrite: false });
const vignette = overlay(new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), vigMat));
vignette.position.set(0, 0, -0.5); vignette.renderOrder = 900; camera.add(vignette);

// Instruction card (head-locked)
const instr = new THREE.Group(); instr.position.set(0, 0.05, -1.3); instr.visible = false; camera.add(instr);
const instrImg = overlay(planeFromImage(IMG.halt, 0.45)); instrImg.position.y = 0.2; instr.add(instrImg);
const instrTxt = overlay(textPanel(0.9, 0.28)); instrTxt.position.y = -0.18; instr.add(instrTxt);
// Round counter (head-locked, low in view)
const hud = overlay(textPanel(0.5, 0.1)); hud.position.set(0, -0.38, -1.0); hud.visible = false; camera.add(hud);
// Live motion meters: head, hand 1, hand 2 (tick mark = fail line for HALT)
const meters = [0, 1, 2].map(i => {
  const mk = (color, op, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.012).translate(0.5, 0, 0),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, depthWrite: false, depthTest: false })); m.renderOrder = z; return m; };
  const x0 = (i - 1) * 0.17 - 0.07;
  const bg = mk(0x222222, 0.8, 1000), fill = mk(0x44ff66, 1, 1001), tick = mk(0xffffff, 0.9, 1002);
  bg.scale.x = 0.14; tick.scale.x = 0.002;
  bg.position.set(x0, -0.085, 0.001); fill.position.set(x0, -0.085, 0.002); tick.position.set(x0 + 0.07, -0.085, 0.003);
  hud.add(bg, fill, tick); return { fill };
});
// Jumpscare (head-locked)
const scare = overlay(planeFromImage(IMG.attack, 1.4)); scare.position.set(0, 0, -0.8); scare.visible = false; camera.add(scare);

// Menu / result panel (world-locked)
const panel = textPanel(1.2, 0.6); panel.visible = false; scene.add(panel);

// A-90B entity (world-locked billboard)
const entity = planeFromImage(IMG.entity, 1.8); entity.visible = false; scene.add(entity);

// ---------- game state ----------
let spaceType = "local-floor";
let phase = "none", t = 0, round = 0, total = 0, halt = false, movedTime = 0;
const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
// ---------- motion tracking: head (position+rotation) and both hands/arms ----------
const SENS = [{ n: "EASY", m: 1.6 }, { n: "NORMAL", m: 1 }, { n: "HARD", m: 0.6 }];
let sensIdx = 1;
const BASE = { headPos: 0.12, headRot: 22, hand: 0.22 }; // m/s, deg/s, m/s at NORMAL
const WIN = 0.12; // seconds of history used to measure speed (filters single-frame jitter)
class Tracker {
  constructor(posThr, rotThr){ this.posThr = posThr; this.rotThr = rotThr; this.hist = []; this.score = 0; this.active = false; this.kind = ""; }
  reset(){ this.hist.length = 0; this.score = 0; }
  update(now, pts, q, kind){
    if (!pts){ this.active = false; this.kind = ""; this.reset(); return; }
    if (kind !== this.kind){ this.kind = kind; this.reset(); } // source changed (controller<->hand): avoid a false spike
    this.active = true;
    this.hist.push({ t: now, pts, q: q ? q.clone() : null });
    while (this.hist.length > 1 && now - this.hist[0].t > 0.4) this.hist.shift();
    let ref = null; for (const h of this.hist){ if (now - h.t <= WIN){ ref = h; break; } }
    if (!ref || now - ref.t < 0.05){ this.score = 0; return; }
    const dt = now - ref.t, m = SENS[sensIdx].m, n = Math.min(pts.length, ref.pts.length);
    let sp = 0; for (let i = 0; i < n; i++) sp = Math.max(sp, pts[i].distanceTo(ref.pts[i]) / dt);
    let sc = sp / (this.posThr * m);
    if (q && ref.q && this.rotThr) sc = Math.max(sc, THREE.MathUtils.radToDeg(q.angleTo(ref.q)) / dt / (this.rotThr * m));
    this.score = sc;
  }
}
const trackers = { head: new Tracker(BASE.headPos, BASE.headRot), h0: new Tracker(BASE.hand, 0), h1: new Tracker(BASE.hand, 0) };
const motion = { max: 0 };
function handSample(i){
  const h = hands[i], w = h.joints && h.joints["wrist"];
  if (w && w.visible){ // hand tracking: wrist + palm, so arm swings and hand moves both register
    const pts = [w.position.clone()], p = h.joints["middle-finger-metacarpal"];
    if (p && p.visible) pts.push(p.position.clone());
    return { pts, kind: "hand" };
  }
  if (grips[i].visible) return { pts: [grips[i].position.clone()], kind: "ctrl" };
  return null;
}
function resetTrackers(){ Object.values(trackers).forEach(t => t.reset()); motion.max = 0; }

function placeInFront(obj, dist, dy = 0){
  camera.getWorldPosition(tmpV);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.getWorldQuaternion(tmpQ)); dir.y = 0; dir.normalize();
  obj.position.copy(tmpV).addScaledVector(dir, dist); obj.position.y = tmpV.y + dy;
  obj.lookAt(tmpV.x, obj.position.y, tmpV.z);
}
function showPanel(lines, opts){
  panel.draw(lines, opts); placeInFront(panel, 1.4, -0.05); panel.visible = true;
}
function haptic(strength = 1, ms = 200){
  const s = renderer.xr.getSession && renderer.xr.getSession(); if(!s) return;
  for (const src of s.inputSources){
    const gp = src.gamepad; if(!gp) continue;
    try{
      if (gp.hapticActuators && gp.hapticActuators[0]) gp.hapticActuators[0].pulse(strength, ms);
      else if (gp.vibrationActuator) gp.vibrationActuator.playEffect("dual-rumble", { duration: ms, strongMagnitude: strength, weakMagnitude: strength });
    }catch(e){}
  }
}
function hideAll(){ instr.visible = hud.visible = entity.visible = scare.visible = panel.visible = false; vigMat.opacity = 0; }

function showMenu(){
  hideAll(); phase = "menu";
  showPanel([{ text: "A-90B", size: 80 }, { text: "HALT = freeze   PROCEED = move", size: 38 },
    { text: `Sensitivity: ${SENS[sensIdx].n} (grip to change)`, size: 34 }, { text: "Pull trigger / pinch to begin", size: 38 }, { text: spaceType === "unbounded" ? "Play space: UNBOUNDED (roam freely)" : "Play space: FLOOR (fixed origin)", size: 28 }]);
}
function startGame(){
  hideAll(); round = 0; total = 5 + Math.floor(Math.random() * 6);
  play(SND.warning); nextRound();
}
function nextRound(){
  round++; halt = Math.random() < 0.5;
  instrImg.material.map = null; instrImg.material.needsUpdate = true;
  loader.load(halt ? IMG.halt : IMG.proceed, tx => {
    instrImg.material.map = tx; instrImg.material.needsUpdate = true;
    instrImg.scale.set(0.45 * tx.image.width / tx.image.height, 0.45, 1);
  });
  instrTxt.draw([{ text: halt ? "HALT." : "PROCEED.", size: 120 }], { color: halt ? "#ff5555" : "#66ff88" });
  instr.visible = true; play(halt ? SND.halt : SND.proceed); haptic(0.4, 120);
  phase = "instr"; t = 0;
}
function spawnEntity(){
  placeInFront(entity, 2.2, 0); camera.getWorldPosition(tmpV);
  entity.position.y = spaceType === "unbounded" ? tmpV.y - 0.7 : Math.max(0.9, tmpV.y - 0.1); // unbounded has no known floor, so size to the player entity.lookAt(tmpV.x, entity.position.y, tmpV.z);
  entity.visible = true;
  hud.draw([{ text: `ROUND ${round} / ${total}`, size: 56 }]); hud.visible = true;
}
function die(){
  if (phase === "dead") return;
  phase = "dead"; t = 0;
  entity.visible = instr.visible = hud.visible = false;
  scare.visible = true; vigMat.color.set(0x990000); vigMat.opacity = 1;
  play(SND.fail); haptic(1, 1200);
}
function win(){
  hideAll(); phase = "win";
  showPanel([{ text: "SURVIVED", size: 100 }, { text: `${total} rounds cleared`, size: 46 }, { text: "Pull a trigger to play again", size: 40 }], { color: "#66ff88" });
}
ctrls.forEach(c => c.addEventListener("squeezestart", () => { if (phase === "menu"){ sensIdx = (sensIdx + 1) % SENS.length; showMenu(); } }));
function onSelect(){
  if (phase === "menu" || phase === "win" || phase === "lost") startGame();
}

// ---------- per-frame ----------
const clock = new THREE.Clock();
function updateMotion(now){
  trackers.head.update(now, [camera.position.clone()], camera.quaternion, "head");
  [["h0", 0], ["h1", 1]].forEach(([k, i]) => { const smp = handSample(i); trackers[k].update(now, smp && smp.pts, null, smp ? smp.kind : ""); });
  motion.max = Math.max(trackers.head.score, trackers.h0.score, trackers.h1.score);
  if (hud.visible) [trackers.head, trackers.h0, trackers.h1].forEach((tr, i) => {
    const sc = tr.active ? tr.score : 0, f = meters[i].fill;
    f.scale.x = Math.max(0.0001, Math.min(1, sc / 2)) * 0.14;
    f.material.color.set(!tr.active ? 0x666666 : sc >= 1 ? 0xff4444 : sc >= 0.7 ? 0xffcc33 : 0x44ff66);
  });
}

renderer.setAnimationLoop(() => {
  if (!renderer.xr.isPresenting) { renderer.render(scene, camera); return; }
  const dt = Math.min(clock.getDelta(), 0.1); t += dt;
  updateMotion(performance.now() / 1000);

  switch (phase){
    case "instr":
      instr.children.forEach(c => c.material && (c.material.opacity = Math.random() > 0.2 ? 1 : 0.3));
      vigMat.color.set(0x000000); vigMat.opacity = Math.min(0.75, 0.15 + round / total * 0.6);
      if (t >= 1){ instr.visible = false; spawnEntity(); phase = "grace"; t = 0; }
      break;
    case "grace":
      if (t >= 1){ phase = "watch"; t = 0; movedTime = 0; resetTrackers(); }
      break;
    case "watch": {
      const sc = motion.max;
      entity.position.x += (Math.random() - 0.5) * 0.002;
      if (halt){
        movedTime = sc >= 1 ? movedTime + dt : Math.max(0, movedTime - dt * 2);
        if (sc >= 2.5 || movedTime > 0.1){ die(); break; }
        if (t >= 2){ phase = "gap"; t = 0; entity.visible = false; }
      } else {
        movedTime = sc >= 1.5 ? movedTime + dt : Math.max(0, movedTime - dt);
        if (movedTime > 0.12){ phase = "gap"; t = 0; entity.visible = false; break; }
        if (t >= 2) die();
      }
      break; }
    case "gap":
      if (t >= 0.25){ if (round >= total) win(); else nextRound(); }
      break;
    case "dead":
      scare.position.set((Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.06, -0.8 + Math.random() * 0.05);
      if (t >= (isFinite(SND.fail.duration) && SND.fail.duration > 0 ? SND.fail.duration : 2)){
        hideAll(); phase = "lost";
        showPanel([{ text: "YOU DIED", size: 100 }, { text: `Round ${round} / ${total}`, size: 46 }, { text: "Pull a trigger to retry", size: 40 }], { color: "#ff5555" });
      }
      break;
  }
  renderer.render(scene, camera);
});

// ---------- entering XR ----------
const btn = document.getElementById("enter"), msg = document.getElementById("msg");
let session = null;
async function enter(){
  try{
    try{ // prefer an unbounded space so you can walk anywhere; fall back to a floor-anchored space
      session = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["unbounded"], optionalFeatures: ["hand-tracking"] });
      spaceType = "unbounded";
    }catch(err){
      session = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["local-floor"], optionalFeatures: ["hand-tracking"] });
      spaceType = "local-floor";
    }
    renderer.xr.setReferenceSpaceType(spaceType);
    session.addEventListener("end", () => { hideAll(); phase = "none"; document.getElementById("ui").style.display = "flex"; if (renderer.domElement.parentNode) renderer.domElement.remove(); });
    document.body.appendChild(renderer.domElement);
    renderer.domElement.style.cssText = "position:fixed;inset:0;width:100%;height:100%";
    await renderer.xr.setSession(session);
    document.getElementById("ui").style.display = "none";
    resetTrackers(); clock.getDelta();
    Object.values(SND).forEach(a => { try{ a.load(); }catch(e){} });
    setTimeout(showMenu, 600);
  }catch(e){ msg.textContent = "Couldn't start passthrough: " + e.message; }
}
(async () => {
  if (!navigator.xr){ btn.textContent = "WEBXR NOT AVAILABLE"; msg.textContent = "Open this page in the Meta Quest Browser over HTTPS."; return; }
  const ok = await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
  if (!ok){ btn.textContent = "AR NOT SUPPORTED"; msg.textContent = "Needs a Quest 3 / 3S with passthrough enabled in the Quest Browser."; return; }
  btn.disabled = false; btn.textContent = "ENTER PASSTHROUGH"; btn.onclick = enter;
})();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
